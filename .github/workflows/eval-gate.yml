name: RAG Evaluation Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-crag:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install deepeval pytest pytest-asyncio

      - name: Wait for Qdrant Service
        run: |
          until curl -s http://localhost:6333/healthz; do
            echo "Waiting for Qdrant..."
            sleep 2
          done

      - name: Run DeepEval Quality Gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_HOST: "localhost"
          QDRANT_PORT: "6333"
        run: |
          python -m pytest tests/test_eval_pipeline.py -v