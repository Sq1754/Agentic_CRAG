services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: documind-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      # ── Set these in the Render dashboard (sensitive values) ──────────────
      - key: DATABASE_URL
        fromDatabase:
          name: documind-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL after first deploy

  # ── PostgreSQL Database ───────────────────────────────────────────────────
databases:
  - name: documind-postgres
    plan: free
    databaseName: documind
    user: documind
